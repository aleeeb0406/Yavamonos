<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yavamonos · UABC</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="logo_yavamonos.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TOKENS
   ===================================================================== */
:root{
  /* Marca — no modificar */
  --navy:#14274E;
  --lime:#D9E154;
  --white:#FFFFFF;

  /* Neutros derivados de la marca */
  --lime-pale:#F3F6CF;
  --bg:#F4F6FA;            /* fondo de la app */
  --surface:#FFFFFF;       /* tarjetas, barras */
  --surface-2:#EBEFF5;     /* rellenos suaves, hover */
  --line:#DDE2EB;          /* bordes decorativos */
  --line-strong:#8A94AD;   /* bordes de controles (3:1) */
  --text:#14274E;          /* 14.7:1 sobre blanco */
  --text-2:#4A5675;        /* 7.3:1 */
  --text-3:#5A6684;        /* 5.7:1 — mínimo para texto pequeño */
  --on-navy:#FFFFFF;
  --on-navy-2:#B4BDD3;     /* texto secundario sobre navy, 7.8:1 */
  --navy-hover:color-mix(in srgb, var(--navy) 86%, var(--white));
  --lime-hover:color-mix(in srgb, var(--lime) 80%, var(--white));
  --navy-a08:rgba(20,39,78,.08);
  --navy-a16:rgba(20,39,78,.16);
  --scrim:rgba(20,39,78,.56);

  /* Tipografía */
  --font-ui:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display:'Sora', 'Inter', system-ui, sans-serif;
  --fs-xs:.75rem;     /* 12 */
  --fs-sm:.8125rem;   /* 13 */
  --fs-base:.9375rem; /* 15 */
  --fs-md:1rem;       /* 16 */
  --fs-lg:1.125rem;   /* 18 */
  --fs-xl:1.375rem;   /* 22 */
  --fs-2xl:1.75rem;   /* 28 */
  --fs-3xl:2rem;      /* 32 */
  --lh-tight:1.15;
  --lh-snug:1.3;
  --lh-body:1.5;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;

  /* Espaciado (múltiplos de 4) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;

  /* Radios y sombras */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-full:999px;
  --sh-1:0 1px 2px rgba(20,39,78,.06), 0 1px 3px rgba(20,39,78,.04);
  --sh-2:0 8px 20px -6px rgba(20,39,78,.16), 0 2px 4px rgba(20,39,78,.04);
  --sh-3:0 24px 48px -16px rgba(20,39,78,.36);

  /* Movimiento */
  --dur-1:150ms; --dur-2:200ms; --dur-3:250ms;
  --ease:cubic-bezier(.2,.8,.2,1);

  /* Medidas */
  --tap:44px;
  --topbar:64px;
  --tabbar:64px;
  --side-w:248px;
  --panel-w:360px;
}

/* =====================================================================
   BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-ui);font-size:var(--fs-base);line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;accent-color:var(--navy);
}
::selection{background:var(--lime);color:var(--navy);}
input,textarea{caret-color:var(--navy);}
h1,h2,h3{font-family:var(--font-display);color:var(--text);margin:0;font-weight:var(--fw-bold);letter-spacing:-.02em;line-height:var(--lh-tight);text-wrap:balance;}
p{margin:0;}
img{display:block;max-width:100%;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent;}
button:disabled,[aria-disabled="true"]{cursor:not-allowed;}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
.on-dark :focus-visible{outline-color:var(--lime);}
main h1[tabindex="-1"]:focus{outline:none;}
.num{font-variant-numeric:tabular-nums;}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.muted{color:var(--text-2);}
.meta{font-size:var(--fs-sm);color:var(--text-3);}
.grow{flex:1;}
.stack{display:flex;flex-direction:column;gap:var(--sp-3);}
.mt-2{margin-top:var(--sp-2);}.mt-4{margin-top:var(--sp-4);}.mt-6{margin-top:var(--sp-6);}

/* =====================================================================
   SHELL
   ===================================================================== */
#app{min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + var(--sp-6));}
#app.has-cartbar{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 96px);}
.sidebar,.panel{display:none;}
main{padding:0 var(--sp-4) var(--sp-8);max-width:880px;margin:0 auto;}

.topbar{
  position:sticky;top:0;z-index:20;height:var(--topbar);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);
  background:var(--surface);border-bottom:1px solid var(--line);
}
/* El logo siempre va sobre blanco, completo y sin deformar */
.logo{display:flex;align-items:center;justify-content:center;background:var(--white);padding:var(--sp-1);flex-shrink:0;}
.logo img{height:44px;width:auto;object-fit:contain;}
.logo b{font-family:var(--font-display);font-size:var(--fs-lg);color:var(--navy);}

.campus{
  margin-left:auto;display:flex;align-items:center;gap:var(--sp-1);min-height:var(--tap);
  padding:0 var(--sp-2) 0 var(--sp-3);border-radius:var(--r-full);background:var(--surface-2);
  font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--text-2);cursor:pointer;
  transition:background-color var(--dur-1) var(--ease);
}
.campus:hover{background:var(--line);}
.campus svg{width:16px;height:16px;color:var(--navy);}
.campus select{border:0;background:none;font:inherit;color:var(--text);font-weight:var(--fw-semibold);cursor:pointer;min-height:var(--tap);padding:0 var(--sp-1);}
.campus select:focus-visible{outline:none;}
.campus:has(select:focus-visible){outline:2px solid var(--navy);outline-offset:2px;}

.avatar{
  width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--lime);flex-shrink:0;
  display:grid;place-items:center;font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-md);
}
.topbar .avatar{width:var(--tap);height:var(--tap);transition:background-color var(--dur-1) var(--ease);}
.topbar .avatar:hover{background:var(--navy-hover);}

/* Barra inferior */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  height:calc(var(--tabbar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--text-3);position:relative;}
.tab-ico{width:56px;height:30px;border-radius:var(--r-full);display:grid;place-items:center;transition:background-color var(--dur-2) var(--ease);}
.tab-ico svg{width:22px;height:22px;}
@media(hover:hover){.tab:hover .tab-ico{background:var(--surface-2);}}
.tab[aria-current="page"]{color:var(--text);}
.tab[aria-current="page"] .tab-ico{background:var(--lime);}
.tab .dot{position:absolute;top:6px;left:calc(50% + 12px);width:10px;height:10px;border-radius:50%;background:var(--navy);border:2px solid var(--surface);}

/* Barra de carrito (móvil) */
.cartbar{
  position:fixed;left:var(--sp-3);right:var(--sp-3);z-index:29;
  bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + var(--sp-3));
  min-height:56px;padding:0 var(--sp-4);border-radius:var(--r-lg);
  background:var(--navy);color:var(--on-navy);box-shadow:var(--sh-3);
  display:flex;align-items:center;gap:var(--sp-3);font-weight:var(--fw-semibold);
  transition:background-color var(--dur-1) var(--ease),transform var(--dur-1) var(--ease);
  animation:up var(--dur-3) var(--ease);
}
.cartbar:hover{background:var(--navy-hover);}
.cartbar:active{transform:scale(.98);}
.cartbar .count{background:var(--lime);color:var(--navy);min-width:28px;height:28px;padding:0 var(--sp-1);border-radius:var(--r-sm);display:grid;place-items:center;font-size:var(--fs-sm);font-weight:var(--fw-bold);}
.cartbar .total{margin-left:auto;}

/* ---------- Escritorio ---------- */
@media(min-width:1024px){
  #app,#app.has-cartbar{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--panel-w);padding-bottom:0;}
  #app.nopanel{grid-template-columns:var(--side-w) minmax(0,1fr);}
  .topbar,.tabbar,.cartbar{display:none;}
  .sidebar{
    display:flex;flex-direction:column;gap:var(--sp-1);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;
    padding:var(--sp-6) var(--sp-4);background:var(--surface);border-right:1px solid var(--line);
  }
  .sidebar .logo{margin:0 auto var(--sp-6);padding:var(--sp-2);}
  .sidebar .logo img{height:96px;}
  .sidebar nav{display:flex;flex-direction:column;gap:var(--sp-1);}
  .side-link{
    display:flex;align-items:center;gap:var(--sp-3);min-height:var(--tap);padding:0 var(--sp-3);border-radius:var(--r-md);
    font-weight:var(--fw-semibold);color:var(--text-2);width:100%;
    transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease);
  }
  .side-link svg{width:20px;height:20px;}
  .side-link:hover{background:var(--surface-2);color:var(--text);}
  .side-link[aria-current="page"]{background:var(--navy);color:var(--on-navy);}
  .side-link[aria-current="page"] svg{color:var(--lime);}
  .side-link[aria-current="page"]:focus-visible{outline-color:var(--navy);}
  .side-link .badge{margin-left:auto;}
  .sidebar .campus{margin:auto 0 0;border-radius:var(--r-md);justify-content:flex-start;}
  .sidebar .me{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-1) 0;margin-top:var(--sp-3);border-top:1px solid var(--line);font-size:var(--fs-sm);font-weight:var(--fw-semibold);line-height:var(--lh-snug);}
  .sidebar .me span{display:block;font-weight:var(--fw-regular);color:var(--text-3);font-size:var(--fs-xs);margin-top:2px;}
  main{padding:var(--sp-8) var(--sp-10) var(--sp-16);}
  .panel{
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;
    padding:var(--sp-8) var(--sp-6);background:var(--surface);border-left:1px solid var(--line);
  }
  #app.nopanel .panel{display:none;}
}

/* =====================================================================
   COMPONENTES
   ===================================================================== */
/* Botones */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  min-height:48px;padding:0 var(--sp-6);border-radius:var(--r-full);
  background:var(--navy);color:var(--on-navy);font-size:var(--fs-base);font-weight:var(--fw-semibold);line-height:1;white-space:nowrap;
  transition:background-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease),transform var(--dur-1) var(--ease);
}
.btn:hover{background:var(--navy-hover);}
.btn:active{transform:scale(.97);}
.btn svg{width:18px;height:18px;}
.btn-secondary{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line-strong);}
.btn-secondary:hover{background:var(--surface-2);}
.btn-accent{background:var(--lime);color:var(--navy);}
.btn-accent:hover{background:var(--lime-hover);}
.btn-sm{min-height:var(--tap);padding:0 var(--sp-5);font-size:var(--fs-sm);}
.btn-block{width:100%;}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--surface-2);color:var(--text-3);box-shadow:none;transform:none;}
.btn[aria-busy="true"]{background:var(--navy);color:var(--on-navy);cursor:progress;}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.icon-btn{
  width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  background:var(--surface);color:var(--text);box-shadow:var(--sh-1);
  transition:background-color var(--dur-1) var(--ease),transform var(--dur-1) var(--ease);
}
.icon-btn:hover{background:var(--surface-2);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:20px;height:20px;}

/* Favorito */
.fav[aria-pressed="true"] svg{fill:currentColor;}

/* Insignias */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 var(--sp-2);border-radius:var(--r-full);background:var(--lime);color:var(--navy);font-size:var(--fs-xs);font-weight:var(--fw-bold);}
.tag{display:inline-flex;align-items:center;align-self:flex-start;height:22px;padding:0 var(--sp-2);border-radius:var(--r-full);background:var(--lime-pale);color:var(--text);font-size:var(--fs-xs);font-weight:var(--fw-semibold);}
.status{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 var(--sp-3);border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:var(--fw-semibold);white-space:nowrap;background:var(--surface-2);color:var(--text-2);}
.status::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.6;}
.status[data-s="1"]{background:var(--lime-pale);color:var(--text);}
.status[data-s="2"]{background:var(--lime);color:var(--navy);font-weight:var(--fw-bold);}
.status[data-s="2"]::before{background:var(--navy);opacity:1;}
.status[data-s="3"]{color:var(--text-3);}

/* Chips */
.chips{display:flex;gap:var(--sp-2);overflow-x:auto;padding:var(--sp-4) var(--sp-4) var(--sp-1);margin:0 calc(-1 * var(--sp-4));scrollbar-width:none;scroll-padding-inline:var(--sp-4);}
.chips::-webkit-scrollbar{display:none;}
@media(min-width:1024px){.chips{flex-wrap:wrap;overflow:visible;margin:0;padding:var(--sp-4) 0 var(--sp-1);}}
.chip{
  flex-shrink:0;min-height:var(--tap);padding:0 var(--sp-4);border-radius:var(--r-full);
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);
  font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--text-2);white-space:nowrap;
  transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease);
}
.chip:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--line-strong);}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);box-shadow:none;}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:var(--sh-1);}
.card-title{font-size:var(--fs-lg);}

/* Foto / placeholder: si no hay foto se ve un fondo neutro con trama y un ícono */
.ph{
  position:relative;overflow:hidden;flex-shrink:0;display:grid;place-items:center;
  background-color:var(--surface-2);
  background-image:radial-gradient(var(--navy-a08) 1px, transparent 1.4px);background-size:14px 14px;
}
.ph > svg{width:30%;max-width:40px;min-width:20px;height:auto;color:var(--navy);opacity:.3;}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

/* Avisos */
.notice{display:flex;gap:var(--sp-3);align-items:flex-start;margin-top:var(--sp-4);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--lime-pale);color:var(--text);font-size:var(--fs-sm);font-weight:var(--fw-medium);line-height:var(--lh-snug);}
.notice svg{width:20px;height:20px;flex-shrink:0;}
.notice-error{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--navy);font-weight:var(--fw-semibold);}

/* Estados vacíos */
.empty{text-align:center;padding:var(--sp-12) var(--sp-5);color:var(--text-2);display:flex;flex-direction:column;align-items:center;}
.empty-ico{width:64px;height:64px;border-radius:var(--r-lg);background:var(--surface-2);display:grid;place-items:center;color:var(--navy);margin-bottom:var(--sp-4);}
.empty-ico svg{width:28px;height:28px;}
.empty h3{font-size:var(--fs-lg);margin-bottom:var(--sp-2);}
.empty p{max-width:36ch;}
.empty .btn{margin-top:var(--sp-5);}

/* Encabezados */
.page-title{font-size:var(--fs-2xl);padding:var(--sp-6) 0 var(--sp-1);}
.sec-title{font-size:var(--fs-lg);margin:var(--sp-8) 0 var(--sp-3);}
@media(min-width:1024px){.page-title{font-size:var(--fs-3xl);padding-top:0;}.sec-title{font-size:var(--fs-xl);}}
.back{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:var(--tap);margin:var(--sp-2) 0 var(--sp-1) calc(-1 * var(--sp-2));padding:0 var(--sp-2);border-radius:var(--r-sm);font-weight:var(--fw-semibold);font-size:var(--fs-sm);color:var(--text-2);transition:color var(--dur-1) var(--ease),background-color var(--dur-1) var(--ease);}
.back:hover{color:var(--text);background:var(--surface-2);}
.back svg{width:18px;height:18px;}
@media(min-width:1024px){.back{margin-top:calc(-1 * var(--sp-3));}}

/* =====================================================================
   INICIO
   ===================================================================== */
.hello{padding:var(--sp-6) 0 var(--sp-1);}
.hello h1{font-size:var(--fs-2xl);}
.hello p{margin-top:var(--sp-2);color:var(--text-2);font-size:var(--fs-md);}
@media(min-width:1024px){.hello{padding-top:0;}.hello h1{font-size:var(--fs-3xl);}}

.search{position:relative;margin-top:var(--sp-5);}
.search svg{position:absolute;left:var(--sp-4);top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--text-3);pointer-events:none;}
.search input{
  width:100%;min-height:52px;padding:0 var(--sp-4) 0 48px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);
  font:inherit;font-size:var(--fs-md);color:var(--text);transition:border-color var(--dur-1) var(--ease);
}
.search input::placeholder{color:var(--text-3);}
.search input:hover{border-color:var(--line-strong);}
.search input:focus{border-color:var(--navy);}

.live{
  margin-top:var(--sp-5);width:100%;display:flex;align-items:center;gap:var(--sp-4);
  padding:var(--sp-4) var(--sp-5);border-radius:var(--r-lg);background:var(--navy);color:var(--on-navy);text-align:left;box-shadow:var(--sh-2);
  transition:background-color var(--dur-1) var(--ease);
}
.live:hover{background:var(--navy-hover);}
.live b{display:block;font-family:var(--font-display);font-size:var(--fs-md);}
.live span span{display:block;font-size:var(--fs-sm);color:var(--on-navy-2);margin-top:2px;}
.live > svg{margin-left:auto;width:20px;height:20px;color:var(--lime);flex-shrink:0;}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--lime);flex-shrink:0;animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,225,84,.6);}100%{box-shadow:0 0 0 12px rgba(217,225,84,0);}}

.promo{
  margin-top:var(--sp-5);display:grid;grid-template-columns:minmax(0,1fr) 112px;align-items:center;gap:var(--sp-4);
  padding:var(--sp-5);border-radius:var(--r-lg);background:var(--lime);overflow:hidden;
}
.promo h2{font-size:var(--fs-xl);color:var(--navy);}
.promo p{font-size:var(--fs-sm);color:var(--text-2);margin-top:var(--sp-1);}
.promo .btn{margin-top:var(--sp-4);}
.promo .ph{width:112px;height:112px;border-radius:var(--r-md);background-color:var(--lime-pale);}
@media(min-width:640px){.promo{grid-template-columns:minmax(0,1fr) 168px;}.promo .ph{width:168px;height:120px;}}

.rest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--sp-4);}
.rest{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);
  transition:transform var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease);
}
.rest:hover{transform:translateY(-2px);box-shadow:var(--sh-2);}
.rest:has(.rest-link:focus-visible){outline:2px solid var(--navy);outline-offset:2px;}

.rest-body{padding:var(--sp-3) var(--sp-4) var(--sp-4);}

.rest-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1) var(--sp-3);margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--text-2);}

.rating{display:inline-flex;align-items:center;gap:3px;color:var(--text);font-weight:var(--fw-semibold);}
.rating svg{width:14px;height:14px;fill:var(--navy);stroke:var(--navy);}
.pill{
  position:absolute;top:var(--sp-3);left:var(--sp-3);display:inline-flex;align-items:center;gap:var(--sp-1);
  height:28px;padding:0 var(--sp-3);border-radius:var(--r-full);background:var(--surface);color:var(--text);
  font-size:var(--fs-xs);font-weight:var(--fw-semibold);box-shadow:var(--sh-1);
}
.pill svg{width:14px;height:14px;}
.pill.off{background:var(--navy);color:var(--on-navy);}
.rest .fav{position:absolute;top:var(--sp-2);right:var(--sp-2);z-index:2;}

.hscroll{display:flex;gap:var(--sp-3);overflow-x:auto;padding:var(--sp-1) var(--sp-4) var(--sp-2);margin:0 calc(-1 * var(--sp-4));scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:var(--sp-4);}

.pop{width:156px;flex-shrink:0;scroll-snap-align:start;border-radius:var(--r-md);}

}

/* =====================================================================
   CAFETERÍA Y PLATILLOS
   ===================================================================== */
.cover{width:100%;aspect-ratio:16/7;border-radius:var(--r-lg);}
.cover img{object-position:50% 30%;}
.rest-head{display:flex;align-items:flex-start;gap:var(--sp-3);margin-top:var(--sp-4);}

.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--sp-3);}
.dish{
  display:flex;gap:var(--sp-4);align-items:stretch;width:100%;padding:var(--sp-4);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);

}

.dish-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-1);}
.dish-info b{font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--text);line-height:var(--lh-snug);}
.dish-info .desc{font-size:var(--fs-sm);color:var(--text-2);line-height:var(--lh-snug);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.dish-info .price{margin-top:auto;padding-top:var(--sp-2);font-weight:var(--fw-bold);color:var(--text);}
.dish-media{position:relative;flex-shrink:0;}
.dish .ph{width:104px;height:104px;border-radius:var(--r-md);}
.plus{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface);transition:transform var(--dur-1) var(--ease);}
.plus svg{width:18px;height:18px;}
.dish:hover .plus{transform:scale(1.08);}

/* =====================================================================
   HOJA (MODAL)
   ===================================================================== */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade var(--dur-2) var(--ease);}
@keyframes fade{from{opacity:0;}}
@keyframes up{from{transform:translateY(24px);opacity:0;}}
.sheet{
  position:relative;background:var(--surface);width:100%;max-width:520px;max-height:92vh;max-height:92dvh;
  border-radius:var(--r-xl) var(--r-xl) 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-3);
  animation:up var(--dur-3) var(--ease);
}
.sheet:focus{outline:none;}
.overlay.still,.overlay.still .sheet{animation:none;}
@media(min-width:640px){.overlay{align-items:center;padding:var(--sp-6);}.sheet{border-radius:var(--r-xl);}}
.sheet-scroll{overflow-y:auto;flex:1;overscroll-behavior:contain;}
.sheet-media{position:relative;}
.sheet-media .ph{width:100%;aspect-ratio:16/9;max-height:260px;}
.sheet-x{position:absolute;top:var(--sp-3);right:var(--sp-3);z-index:2;}
.sheet-pad{padding:var(--sp-5) var(--sp-5) var(--sp-2);}
.sheet-pad h2{font-size:var(--fs-xl);}
.sheet-from{display:flex;align-items:center;gap:var(--sp-1);margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--text-3);}
.sheet-from svg{width:14px;height:14px;}
.sheet-desc{margin-top:var(--sp-3);color:var(--text-2);}
.sheet-price{margin-top:var(--sp-2);font-weight:var(--fw-bold);font-size:var(--fs-lg);}
.group{margin-top:var(--sp-6);}
.group-head{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-1);}
.group-head b,.group-head label b{font-family:var(--font-display);font-size:var(--fs-md);}
.req{font-size:var(--fs-xs);font-weight:var(--fw-semibold);padding:2px var(--sp-2);border-radius:var(--r-full);background:var(--surface-2);color:var(--text-2);}
.req.one{background:var(--lime-pale);color:var(--text);}
.opt{
  position:relative;display:flex;align-items:center;gap:var(--sp-3);min-height:52px;padding:0 var(--sp-2);margin:0 calc(-1 * var(--sp-2));
  width:calc(100% + var(--sp-4));border-radius:var(--r-sm);font-size:var(--fs-base);
  transition:background-color var(--dur-1) var(--ease);
}
@media(hover:hover){.opt:hover{background:var(--bg);}}
.opt + .opt::before{content:'';position:absolute;left:var(--sp-2);right:var(--sp-2);top:0;height:1px;background:var(--line);}
.opt .mark{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-strong);flex-shrink:0;display:grid;place-items:center;transition:background-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease);}
.opt .mark.sq{border-radius:6px;}

.opt[aria-checked="true"] .mark{background:var(--navy);box-shadow:none;}
.opt[aria-checked="true"] .mark:not(.sq)::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--lime);}
.opt[aria-checked="true"] .mark.sq svg{opacity:1;}
.opt[aria-checked="true"]{font-weight:var(--fw-semibold);}
.opt .extra{margin-left:auto;color:var(--text-2);font-size:var(--fs-sm);font-weight:var(--fw-medium);}
textarea{
  width:100%;margin-top:var(--sp-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-3);
  font:inherit;font-size:var(--fs-md);resize:none;background:var(--bg);color:var(--text);transition:border-color var(--dur-1) var(--ease);
}
textarea::placeholder{color:var(--text-3);}
textarea:hover{border-color:var(--line-strong);}
textarea:focus{border-color:var(--navy);}
.sheet-foot{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-5) calc(var(--sp-4) + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);}
.confirm-pad{padding:var(--sp-6);}
.confirm-actions{display:flex;gap:var(--sp-3);margin-top:var(--sp-6);}

.stepper{display:flex;align-items:center;gap:var(--sp-1);background:var(--surface-2);border-radius:var(--r-full);padding:2px;flex-shrink:0;}
.stepper button{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--sh-1);transition:background-color var(--dur-1) var(--ease),transform var(--dur-1) var(--ease);}
.stepper button:hover{background:var(--bg);}
.stepper button:active{transform:scale(.92);}
.stepper button[aria-disabled="true"]{color:var(--line-strong);box-shadow:none;background:transparent;transform:none;}
.stepper button svg{width:16px;height:16px;}
.stepper span{min-width:28px;text-align:center;font-weight:var(--fw-bold);}
.stepper.sm button{width:36px;height:36px;}

/* =====================================================================
   CARRITO Y PAGO
   ===================================================================== */
.line{display:flex;gap:var(--sp-3);padding:var(--sp-4) 0;border-bottom:1px solid var(--line);align-items:center;}
.line .ph{width:56px;height:56px;border-radius:var(--r-md);}
.line-info{flex:1;min-width:0;}
.line-info b{font-size:var(--fs-base);font-weight:var(--fw-semibold);display:block;line-height:var(--lh-snug);}
.line-info span{font-size:var(--fs-sm);color:var(--text-3);display:block;line-height:var(--lh-snug);margin-top:2px;}
.line-info .price{color:var(--text);font-weight:var(--fw-bold);font-size:var(--fs-sm);margin-top:var(--sp-1);}
.panel .line .ph{width:48px;height:48px;}
.summary{margin-top:var(--sp-4);}
.sum-row{display:flex;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-1) 0;font-size:var(--fs-sm);color:var(--text-2);}
.sum-row.total{font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-lg);color:var(--text);padding-top:var(--sp-3);margin-top:var(--sp-2);border-top:1px solid var(--line);}
.field-title{font-size:var(--fs-md);margin:var(--sp-8) 0 var(--sp-3);}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);}
@media(min-width:640px){.choices{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}}
.choice{
  position:relative;min-height:60px;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:var(--fw-semibold);font-size:var(--fs-sm);
  transition:box-shadow var(--dur-1) var(--ease),background-color var(--dur-1) var(--ease);
}
.choice:hover{box-shadow:inset 0 0 0 1px var(--line-strong);}
.choice small{display:block;font-weight:var(--fw-regular);color:var(--text-3);font-size:var(--fs-xs);margin-top:2px;}
.choice .chk{position:absolute;top:var(--sp-2);right:var(--sp-2);width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--lime);display:none;place-items:center;}
.choice .chk svg{width:12px;height:12px;stroke-width:3;}
.choice[aria-pressed="true"]{background:var(--lime-pale);box-shadow:inset 0 0 0 2px var(--navy);}
.choice[aria-pressed="true"] .chk{display:grid;}
.pickup-box{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-4);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);}
.tile{width:44px;height:44px;border-radius:var(--r-md);background:var(--navy);color:var(--lime);display:grid;place-items:center;flex-shrink:0;}
.tile svg{width:20px;height:20px;}
.checkout{display:grid;gap:0 var(--sp-8);}
.summary-card{margin-top:var(--sp-8);}
.summary-card .btn{margin-top:var(--sp-5);}
.fine-print{display:flex;align-items:center;justify-content:center;gap:var(--sp-1);margin-top:var(--sp-3);font-size:var(--fs-xs);color:var(--text-3);text-align:center;}
.fine-print svg{width:14px;height:14px;}
@media(min-width:1024px){.checkout{grid-template-columns:minmax(0,1fr) 340px;align-items:start;}.checkout aside{position:sticky;top:var(--sp-8);}.summary-card{margin-top:var(--sp-4);}}
.panel h2{font-size:var(--fs-xl);}
.panel .sub{font-size:var(--fs-sm);color:var(--text-3);margin-top:var(--sp-1);}
.panel .btn{margin-top:var(--sp-5);}
.panel-empty{text-align:center;color:var(--text-2);font-size:var(--fs-sm);padding:var(--sp-12) var(--sp-3);}
.panel-empty .empty-ico{margin:0 auto var(--sp-4);}

/* =====================================================================
   SEGUIMIENTO Y QR
   ===================================================================== */
.track{display:grid;gap:var(--sp-4);grid-template-areas:"status" "qr" "steps" "sum";}
.track > .a-status{grid-area:status;}.track > .a-qr{grid-area:qr;}.track > .a-steps{grid-area:steps;}.track > .a-sum{grid-area:sum;}
@media(min-width:900px){
  .track{grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"status qr" "steps qr" "sum qr";align-items:start;}
  .track > .a-qr{position:sticky;top:var(--sp-8);}
}
.status-card{background:var(--navy);color:var(--on-navy);border-radius:var(--r-xl);padding:var(--sp-6);box-shadow:var(--sh-2);}
.status-card h1{color:var(--on-navy);font-size:var(--fs-2xl);}
.status-card > p{color:var(--on-navy-2);margin-top:var(--sp-2);font-size:var(--fs-md);}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-1);margin-top:var(--sp-6);}
.bar i{height:8px;border-radius:var(--r-full);background:rgba(255,255,255,.16);transition:background-color var(--dur-3) var(--ease);}
.bar i.on{background:var(--lime);}
.status-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3);font-size:var(--fs-sm);color:var(--on-navy-2);}
.status-foot .now{display:inline-flex;align-items:center;gap:var(--sp-2);color:var(--on-navy);font-weight:var(--fw-semibold);}
.status-foot .pulse{width:10px;height:10px;}
.status-foot .code-chip{font-family:var(--font-display);font-weight:var(--fw-bold);color:var(--lime);letter-spacing:.04em;}

.steps{list-style:none;margin:var(--sp-2) 0 0;padding:0;}
.step{display:flex;gap:var(--sp-4);padding:var(--sp-3) 0;position:relative;}
.step:not(:last-child)::after{content:'';position:absolute;left:13px;top:42px;bottom:-6px;width:2px;border-radius:2px;background:var(--line);}
.step.done:not(:last-child)::after{background:var(--navy);}
.dotn{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--text-3);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:var(--fw-bold);flex-shrink:0;z-index:1;}
.dotn svg{width:14px;height:14px;stroke-width:3;}
.step.done .dotn{background:var(--navy);color:var(--lime);}
.step.now .dotn{background:var(--lime);color:var(--navy);box-shadow:0 0 0 5px var(--lime-pale);}
.step b{display:block;font-size:var(--fs-base);font-weight:var(--fw-semibold);}
.step span{font-size:var(--fs-sm);color:var(--text-3);}
.step.todo b{color:var(--text-3);font-weight:var(--fw-medium);}

.qr-card{text-align:center;padding:var(--sp-6);}
.qr-card h2{font-size:var(--fs-lg);}
.qr-frame{position:relative;width:min(100%,248px);aspect-ratio:1;margin:var(--sp-5) auto var(--sp-4);}

.qr svg{width:100%;height:100%;display:block;fill:var(--navy);}

.qr-lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);padding:var(--sp-6);font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--text);line-height:var(--lh-snug);}

.qr-card.is-ready .qr-frame{animation:ready var(--dur-3) var(--ease);}
@keyframes ready{from{transform:scale(.96);opacity:.4;}}
.code{font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-2xl);letter-spacing:.08em;color:var(--text);}
.qr-place{display:flex;align-items:center;justify-content:center;gap:var(--sp-1);margin-top:var(--sp-2);font-size:var(--fs-sm);color:var(--text-2);}
.qr-place svg{width:16px;height:16px;flex-shrink:0;}
.qr-card .btn{margin-top:var(--sp-5);}

/* =====================================================================
   PEDIDOS Y PERFIL
   ===================================================================== */
.order-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:var(--sp-2) var(--sp-4);align-items:center;width:100%;padding:var(--sp-4);border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-2) var(--ease);}
.order-row:hover{border-color:var(--line-strong);box-shadow:var(--sh-2);}

/* en móvil la insignia baja a su propia línea para no apretar el texto */
@media(max-width:559px){.order-row{grid-template-columns:56px minmax(0,1fr);align-items:start;}.order-row .status{grid-column:2;justify-self:start;}}
.profile-head{display:flex;align-items:center;gap:var(--sp-4);margin:var(--sp-4) 0 var(--sp-6);}
.profile-head .avatar{width:64px;height:64px;font-size:var(--fs-xl);}
.profile-name{font-size:var(--fs-xl);}
.profile-stack{max-width:560px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);min-height:52px;}
.row:last-child{border-bottom:0;}
.row span{color:var(--text-2);}
.row b{font-weight:var(--fw-semibold);text-align:right;}
.wallet{background:var(--navy);color:var(--on-navy);border-radius:var(--r-xl);padding:var(--sp-6);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);box-shadow:var(--sh-2);}
.wallet span{font-size:var(--fs-sm);color:var(--on-navy-2);}
.wallet .amt{font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-3xl);color:var(--lime);line-height:var(--lh-tight);margin-top:var(--sp-1);}

/* Toast */
.toast{
  position:fixed;left:50%;top:var(--sp-3);transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:var(--sp-2);max-width:calc(100vw - var(--sp-8));
  padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--navy);color:var(--on-navy);

}

/* Movimiento reducido: se conservan los cambios de estado, sin desplazamientos */
@media(prefers-reduced-motion:reduce){

}

    const dishes = Object.values(DISH).filter(d=>inCampus(REST[d.restId]) && d.n.toLowerCase().includes(q));
    rests = rests.filter(r=>r.name.toLowerCase().includes(q)||r.tags.some(t=>t.toLowerCase().includes(q))||dishes.some(d=>d.restId===r.id));
    if(!rests.length && !dishes.length) return emptyState('search', `Nada con “${esc(S.q)}”`, 'Prueba con otro platillo o revisa todas las cafeterías.');
    return `${dishes.length?`<h2 class="sec-title">Platillos</h2><div class="dish-grid">${dishes.map(d=>dishCard(d,true)).join('')}</div>`:''}

  }
  const pops = Object.values(DISH).filter(d=>d.pop && REST[d.restId].open && inCampus(REST[d.restId]));

  return `

}

/* QR real (librería qrcode-generator). Si no carga, se dibuja un patrón de muestra. */
function qrSvg(code){
  let N, cells = '';
  if(window.qrcode){
    const q = qrcode(0,'M'); q.addData(code); q.make(); N = q.getModuleCount();
    for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(q.isDark(y,x)) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  } else {
    let seed = 7; for(const c of code) seed = (seed*33 + c.charCodeAt(0)) >>> 0;
    const rnd = () => (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296;
    N = 21; const inFinder = (x,y) => (x<7&&y<7)||(x>=N-7&&y<7)||(x<7&&y>=N-7);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(!inFinder(x,y) && rnd()>.52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    const finder = (x,y) => `<path d="M${x} ${y}h7v7h-7z M${x+1} ${y+1}v5h5v-5z" fill-rule="evenodd"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
    cells += finder(0,0)+finder(N-7,0)+finder(0,N-7);
  }
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" role="img" aria-label="Código QR del pedido ${code}">${cells}</svg>`;
}

/* ---------- FOCO ----------
   Cada render reescribe el HTML, así que guardamos qué control tenía el foco
   y lo devolvemos al nuevo nodo equivalente. */
function focusKey(el){
  if(!el || el===document.body) return null;
  if(el.id) return '#'+CSS.escape(el.id);
  if(el.dataset && el.dataset.a) return `[data-a="${el.dataset.a}"]`+(el.dataset.id!=null?`[data-id="${CSS.escape(el.dataset.id)}"]`:'');
  return null;
}
function selOf(el){
  try{ return el && el.selectionStart!=null ? [el.selectionStart, el.selectionEnd] : null; }catch(e){ return null; }
}
function restoreFocus(key, sel){
  if(!key) return false;
  const el = [...document.querySelectorAll(key)].find(n=>n.getClientRects().length);
  if(!el) return false;
  el.focus({preventScroll:true});
  if(sel) try{ el.setSelectionRange(sel[0], sel[1]); }catch(e){}
  return true;
}
function focusMain(){
  const h = $('main h1');
  if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
}

const navOf = v => v==='rest'?'home':v==='order'?'orders':v;
const cur = on => on ? ' aria-current="page"' : '';

function render(){

        <button class="side-link" data-a="go" data-id="cart"${cur(S.view==='cart')}>${ic('bag')}Tu pedido${n?`<span class="badge">${n}<span class="sr"> artículos</span></span>`:''}</button>

    <nav class="tabbar" aria-label="Principal">${NAV.map(([v,l,i])=>{ const on = navOf(S.view)===v; return `<button class="tab" data-a="go" data-id="${v}"${cur(on)}><span class="tab-ico">${ic(i)}</span>${l}${v==='orders'&&live?'<i class="dot" aria-hidden="true"></i><span class="sr"> (pedido en curso)</span>':''}</button>`; }).join('')}</nav>`;
  if(!renderLayer()) restoreFocus(key, sel);
}

/* Devuelve true si se encargó del foco (diálogo abierto o recién cerrado). */
function renderLayer(){
  const layer = $('#layer'), wasOpen = !!layer.firstElementChild;
  const a = document.activeElement, inLayer = layer.contains(a);
  const key = inLayer ? focusKey(a) : null, sel = inLayer ? selOf(a) : null;
  const open = !!(S.sheet||S.confirm);
  if(open && !wasOpen) S.opener = focusKey(a);
  const sc = $('#sheetScroll'), top = sc?sc.scrollTop:0;
  layer.innerHTML = S.confirm ? viewConfirm() : S.sheet ? viewSheet() : '';
  if(wasOpen && open) layer.firstElementChild.classList.add('still');
  const sc2 = $('#sheetScroll'); if(sc2) sc2.scrollTop = top;
  document.body.style.overflow = open ? 'hidden' : '';
  $('#app').inert = open;           // el fondo no recibe foco ni lectores de pantalla
  if(open){
    if(!restoreFocus(key, sel)) layer.querySelector('[role=dialog],[role=alertdialog]').focus({preventScroll:true});
    return true;
  }
  if(wasOpen){
    if(!restoreFocus(S.opener)) focusMain();
    S.opener = null;
    return true;
  }
  return false;
}

function addToCart(){
  const sh = S.sheet, d = DISH[sh.dishId];
  const opts = [];
  (d.g||[]).forEach((g,gi)=>{
    const grp = GROUPS[g], sel = sh.sel[gi];
    (grp.one?[sel]:sel).forEach(ci=>opts.push(grp.c[ci][0]));
  });
  const note = sh.note.trim(), key = d.id+'|'+opts.join(',')+'|'+note;
  const found = S.cart.items.find(i=>i.key===key);
  if(found) found.qty += sh.qty;
  else S.cart.items.push({key, dishId:d.id, qty:sh.qty, opts, unit:sheetUnit(), note});
  S.cart.restId = d.restId;
  S.sheet = null;
  render();
  toast(`${d.n} agregado a tu pedido`);
}

function advance(o, status, delay){
  setTimeout(()=>{
    if(o.status>=status) return;
    o.status = status; o.times[status] = fmtTime(new Date());
    render();   // render() conserva el foco y la posición del cursor si estás escribiendo
    toast(status===2?`Tu pedido ${o.code} está listo para recoger`:`${REST[o.restId].name} está preparando tu pedido`);
  }, delay);
}

function placeOrder(){
  const now = new Date(), total = cartSub()+FEE;
  if(S.pay==='saldo') USER.saldo -= total, PAY.saldo[1] = '$'+USER.saldo+' disponibles';
  const o = {
    id:Date.now(), code:'YV-'+(1000+Math.floor(Math.random()*9000)), restId:S.cart.restId, status:0,
    when:'Hoy, '+fmtTime(now), times:[fmtTime(now)], pickup:SLOTS[S.pickup][0], pay:S.pay, total, items:S.cart.items
  };
  S.orders.unshift(o);
  S.cart = {restId:null, items:[]}; S.pickup = 0; S.orderId = o.id;
  go('order');
  toast('Pedido confirmado. Te avisamos cuando esté listo.');
  // Simulación del avance en cocina para la demo
  advance(o, 1, 5000);
  advance(o, 2, 13000);
}

const ACT = {
  go: id => go(id),
  rest: id => { S.restId = id; S.menuSec = 'Todo'; go('rest'); },
  cat: id => { S.cat = id; render(); },
  sec: id => { S.menuSec = id; render(); },
  campus: id => { S.campus = id; S.q = ''; render(); focusMain(); },
  fav: id => {
    const r = REST[id];
    S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id);
    render();
    toast(S.favs.has(id) ? `${r.name} guardada en favoritos` : `${r.name} quitada de favoritos`);
  },
  dish: id => {
    const d = DISH[id];
    S.sheet = {dishId:id, qty:1, note:'', sel:(d.g||[]).map(g=>GROUPS[g].one?0:[])};
    renderLayer();
  },
  opt: id => {
    const [gi,ci] = id.split('-').map(Number), d = DISH[S.sheet.dishId], grp = GROUPS[d.g[gi]];
    if(grp.one) S.sheet.sel[gi] = ci;
    else { const a = S.sheet.sel[gi], k = a.indexOf(ci); k<0 ? a.push(ci) : a.splice(k,1); }
    renderLayer();
  },
  inc: id => {
    if(id==='sheet'){ S.sheet.qty = Math.min(20, S.sheet.qty+1); return renderLayer(); }
    S.cart.items[id].qty++; render();
  },
  dec: id => {
    if(id==='sheet'){ S.sheet.qty = Math.max(1, S.sheet.qty-1); return renderLayer(); }
    const it = S.cart.items[id], name = DISH[it.dishId].n;
    if(--it.qty<=0){ S.cart.items.splice(id,1); toast(`${name} quitado de tu pedido`); }
    if(!S.cart.items.length) S.cart.restId = null;
    render();
    if(!document.activeElement || document.activeElement===document.body) focusMain();
  },
  add: () => {
    const d = DISH[S.sheet.dishId];
    if(S.cart.items.length && S.cart.restId!==d.restId){ S.confirm = true; return renderLayer(); }
    addToCart();
  },
  replace: () => { S.cart = {restId:null, items:[]}; S.confirm = null; addToCart(); },
  close: () => { if(S.confirm) S.confirm = null; else S.sheet = null; renderLayer(); },
  overlay: (id, t, e) => { if(e.target===t) ACT.close(); },
  slot: id => { if(!S.placing){ S.pickup = +id; render(); } },
  pay: id => { if(!S.placing){ S.pay = id; render(); } },
  place: () => {
    if(S.placing) return;
    // Estado de carga breve para que el pago se sienta real en la demo
    S.placing = true; render();
    setTimeout(()=>{ S.placing = false; placeOrder(); }, 900);
  },
  order: id => { S.orderId = +id; go('order'); },
  picked: id => {
    const o = S.orders.find(x=>x.id===+id);
    o.status = 3; o.times[3] = fmtTime(new Date());
    render(); toast('Buen provecho');
  },
  reorder: id => {
    const o = S.orders.find(x=>x.id===+id);
    if(!REST[o.restId].open) return toast(`${REST[o.restId].name} está cerrada por ahora`);
    S.cart = {restId:o.restId, items:o.items.map(i=>({...i, key:i.dishId+'|'+i.opts.join(',')+'|'+i.note}))};
    go('cart');
  },
  soon: () => toast('Disponible en la versión final')
};

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-a]');
  if(!t || !ACT[t.dataset.a]) return;
  if(t.getAttribute('aria-disabled')==='true') return;
  ACT[t.dataset.a](t.dataset.id, t, e);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && (S.sheet||S.confirm)) return ACT.close();
  // grupos de opción única: las flechas mueven y seleccionan, como un radio nativo
  if(e.target.matches && e.target.matches('[role=radio]') && ['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    const items = [...e.target.closest('[role=radiogroup]').querySelectorAll('[role=radio]')];
    const step = (e.key==='ArrowDown'||e.key==='ArrowRight') ? 1 : -1;
    const next = items[(items.indexOf(e.target)+step+items.length)%items.length];
    next.focus(); next.click();
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ S.q = e.target.value; $('#results').innerHTML = homeResults(); }
  if(e.target.id==='note') S.sheet.note = e.target.value;
});
document.addEventListener('change', e=>{
  if(e.target.matches('.campus select')){ S.campus = e.target.value; S.q = ''; render(); }
});

render();
</script>
</body>
</html>
